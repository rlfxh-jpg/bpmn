<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Agent 执行过程</title>
  <desc id="desc">从用户提出提示词到 Agent 规划、读取上下文、调用工具、修改验证并交付结果的流程图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#f2f7f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f2937" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 34px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #102033; }
      .subtitle { font: 400 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #52616f; }
      .box { fill: #ffffff; stroke: #d8e3ec; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .box-alt { fill: #f9fff9; stroke: #cfe6d2; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .box-warn { fill: #fffaf0; stroke: #ead09a; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .step { font: 700 20px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #12213a; }
      .body { font: 400 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #435364; }
      .num { font: 700 19px Arial, sans-serif; fill: #ffffff; }
      .line { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #7c8aa0; stroke-width: 2; stroke-dasharray: 8 8; fill: none; }
      .pill { fill: #2563eb; }
      .small { font: 400 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #5b6878; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="64" y="66" class="title">Agent 从提示词到交付的执行过程</text>
  <text x="64" y="98" class="subtitle">核心不是一次回答，而是“理解目标 - 规划 - 调工具 - 验证 - 交付”的闭环。</text>

  <g transform="translate(64 150)">
    <rect class="box" width="210" height="130"/>
    <circle class="pill" cx="34" cy="34" r="18"/><text x="28" y="41" class="num">1</text>
    <text x="62" y="39" class="step">用户提出目标</text>
    <text x="26" y="75" class="body">需求、截图、错误日志</text>
    <text x="26" y="101" class="body">或一段待实现说明</text>
  </g>

  <path class="line" d="M285 215 C320 215 332 215 367 215"/>

  <g transform="translate(378 150)">
    <rect class="box-alt" width="224" height="130"/>
    <circle class="pill" cx="34" cy="34" r="18"/><text x="28" y="41" class="num">2</text>
    <text x="62" y="39" class="step">理解上下文</text>
    <text x="26" y="75" class="body">读取 AGENTS.md、代码</text>
    <text x="26" y="101" class="body">文档、历史约定与环境</text>
  </g>

  <path class="line" d="M612 215 C648 215 660 215 696 215"/>

  <g transform="translate(706 150)">
    <rect class="box" width="224" height="130"/>
    <circle class="pill" cx="34" cy="34" r="18"/><text x="28" y="41" class="num">3</text>
    <text x="62" y="39" class="step">制定执行计划</text>
    <text x="26" y="75" class="body">拆任务、判断风险</text>
    <text x="26" y="101" class="body">决定是否并行委派</text>
  </g>

  <path class="line" d="M940 215 C976 215 988 215 1024 215"/>

  <g transform="translate(1034 150)">
    <rect class="box-warn" width="182" height="130"/>
    <circle class="pill" cx="34" cy="34" r="18"/><text x="28" y="41" class="num">4</text>
    <text x="62" y="39" class="step">调用工具</text>
    <text x="26" y="75" class="body">Shell、MCP、搜索</text>
    <text x="26" y="101" class="body">编辑器、浏览器等</text>
  </g>

  <path class="line" d="M1125 286 C1125 336 1110 354 1062 372"/>

  <g transform="translate(820 394)">
    <rect class="box-alt" width="250" height="130"/>
    <circle class="pill" cx="34" cy="34" r="18"/><text x="28" y="41" class="num">5</text>
    <text x="62" y="39" class="step">修改与验证</text>
    <text x="26" y="75" class="body">改文件、跑测试、构建</text>
    <text x="26" y="101" class="body">人工或自动检查结果</text>
  </g>

  <path class="line" d="M812 459 C760 459 748 459 696 459"/>

  <g transform="translate(470 394)">
    <rect class="box" width="216" height="130"/>
    <circle class="pill" cx="34" cy="34" r="18"/><text x="28" y="41" class="num">6</text>
    <text x="62" y="39" class="step">迭代修正</text>
    <text x="26" y="75" class="body">根据错误、反馈</text>
    <text x="26" y="101" class="body">继续规划和执行</text>
  </g>

  <path class="line" d="M462 459 C410 459 398 459 346 459"/>

  <g transform="translate(118 394)">
    <rect class="box" width="218" height="130"/>
    <circle class="pill" cx="34" cy="34" r="18"/><text x="28" y="41" class="num">7</text>
    <text x="62" y="39" class="step">交付结果</text>
    <text x="26" y="75" class="body">说明改动、验证证据</text>
    <text x="26" y="101" class="body">必要时给出后续建议</text>
  </g>

  <path class="dash" d="M578 394 C620 342 716 318 840 295"/>
  <text x="628" y="345" class="small">验证失败会回到计划与工具调用</text>

  <rect x="78" y="612" width="1124" height="54" rx="16" fill="#102033" opacity="0.92"/>
  <text x="106" y="646" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" fill="#ffffff">
    关键理解：Agent 不是“模型本身”，而是模型 + 上下文 + 工具 + 权限 + 运行时循环组合出来的工作系统。
  </text>
</svg>
